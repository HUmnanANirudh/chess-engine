<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chess Engine - AI vs Human</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
        }
        .container {
            display: flex;
            gap: 30px;
            background: white;
            border-radius: 15px;
            box-shadow: 0 20px 60px rgba(0,0,0,0.3);
            padding: 30px;
            max-width: 1100px;
        }
        .title { font-size: 28px; font-weight: bold; color: #333; text-align: center; margin-bottom: 20px; }
        .chessboard {
            display: grid;
            grid-template-columns: repeat(8, 60px);
            grid-template-rows: repeat(8, 60px);
            gap: 0;
            border: 3px solid #333;
            background: #333;
            box-shadow: 0 10px 30px rgba(0,0,0,0.2);
        }
        .square {
            width: 60px;
            height: 60px;
            display: flex;
            justify-content: center;
            align-items: center;
            font-size: 40px;
            cursor: pointer;
            user-select: none;
            transition: all 0.2s;
        }
        .square.light { background: #f0d9b5; }
        .square.dark { background: #b58863; }
        .square:hover { filter: brightness(0.95); }
        .square.selected { background: #baca44 !important; }
        .square.highlight { background: #a8d8a8 !important; }
        .control-panel {
            width: 300px;
            display: flex;
            flex-direction: column;
            gap: 20px;
        }
        .panel-section {
            background: #f8f9fa;
            border-radius: 10px;
            padding: 15px;
            border-left: 4px solid #667eea;
        }
        .panel-title { font-size: 14px; font-weight: bold; color: #333; margin-bottom: 10px; text-transform: uppercase; }
        .status-display {
            font-size: 16px;
            font-weight: bold;
            color: #667eea;
            padding: 15px;
            background: white;
            border-radius: 8px;
            text-align: center;
            border: 2px solid #667eea;
        }
        .move-history {
            background: white;
            border: 1px solid #ddd;
            border-radius: 6px;
            padding: 10px;
            max-height: 120px;
            overflow-y: auto;
            font-size: 13px;
            font-family: 'Courier New', monospace;
            color: #333;
        }
        .eval-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }
        .eval-bar {
            position: relative;
            width: 26px;
            height: 180px;
            border-radius: 13px;
            overflow: hidden;
            border: 2px solid #333;
            background: linear-gradient(to top, #111 0%, #eee 100%);
            display: flex;
            flex-direction: column-reverse;
        }
        .eval-white {
            background: #f8f9fa;
            width: 100%;
            height: 50%;
            transition: height 0.2s ease-out;
        }
        .eval-black {
            background: #343a40;
            width: 100%;
            height: 50%;
            transition: height 0.2s ease-out;
        }
        .eval-labels {
            display: flex;
            justify-content: space-between;
            width: 100%;
            font-size: 11px;
            color: #555;
        }
        .eval-labels span {
            flex: 1;
            text-align: center;
        }
        button {
            padding: 12px 20px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            transition: all 0.3s;
            text-transform: uppercase;
        }
        .btn-primary {
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: white;
        }
        .btn-primary:hover { transform: translateY(-2px); box-shadow: 0 5px 15px rgba(102,126,234,0.4); }
        .btn-secondary { background: #e9ecef; color: #333; border: 2px solid #ddd; }
        .btn-secondary:hover { background: #dee2e6; }
        .difficulty-select {
            width: 100%;
            padding: 10px;
            border: 2px solid #ddd;
            border-radius: 6px;
            font-size: 14px;
            cursor: pointer;
        }
        .button-group { display: flex; flex-direction: column; gap: 10px; }
        @media (max-width: 1024px) {
            .container { flex-direction: column; align-items: center; }
            .control-panel { width: 100%; max-width: 300px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div>
            <div class="title">♟ Chess Engine</div>
            <div class="chessboard" id="board"></div>
        </div>
        <div class="control-panel">
            <div class="status-display" id="status">White to Move</div>
            <div class="panel-section">
                <div class="panel-title">Evaluation</div>
                <div class="eval-container">
                    <div class="eval-bar">
                        <div class="eval-white" id="evalWhite"></div>
                        <div class="eval-black" id="evalBlack"></div>
                    </div>
                    <div class="eval-labels">
                        <span>White</span>
                        <span id="evalScore">0.0</span>
                        <span>Black</span>
                    </div>
                </div>
            </div>
            <div class="panel-section">
                <div class="panel-title">Difficulty</div>
                <select class="difficulty-select" id="difficulty">
                    <option value="2">Easy</option>
                    <option value="3">Medium</option>
                    <option value="4" selected>Hard</option>
                </select>
            </div>
            <div class="panel-section">
                <div class="panel-title">Moves</div>
                <div class="move-history" id="moves"></div>
            </div>
            <div class="panel-section">
                <div class="panel-title">Post-Game Analysis</div>
                <div class="move-history" id="analysis">Play a full game to see move probabilities here.</div>
            </div>
            <div class="button-group">
                <button class="btn-primary" id="newBtn">New Game</button>
                <button class="btn-secondary" id="undoBtn">Undo</button>
            </div>
        </div>
    </div>
    <script src="chess_game.js"></script>
</body>
</html>
